schema_version: "1.0"
workflow:
  id: "speckit"
  name: "完整中文 SDD 周期"
  version: "1.1.0"
  author: "GitHub"
  description: "依次运行规格、计划、任务、存量兼容分析与实现，并包含人工审阅关卡"

requires:
  # 0.8.5 is the first release with engine-side resolution of the
  # ``integration: "auto"`` default. Older versions would treat "auto"
  # as a literal integration key and fail at dispatch.
  speckit_version: ">=0.8.5"
  integrations:
    # The four commands below (specify, plan, tasks, implement) are core
    # spec-kit commands provided by every integration. The list here is an
    # advisory, non-exhaustive compatibility hint following the documented
    # ``any: [...]`` schema -- it is NOT a closed set. The workflow runs
    # against any integration the project was initialized with, including
    # ones not listed below, as long as that integration provides the four
    # core commands referenced in ``steps``.
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "请用中文描述你希望构建的功能"
  integration:
    type: string
    default: "auto"
    prompt: "选择集成（如 claude、copilot、gemini；auto 使用项目初始化时的集成）"
  scope:
    type: string
    default: "full"
    enum: ["full", "backend-only", "frontend-only"]
  task_backend:
    type: string
    required: true
    enum: ["local", "gitlab"]
    prompt: "请选择任务管理方式：local（本地 tasks.md）或 gitlab（GitLab Issues）"
  gitlab_project:
    type: string
    default: ""
    prompt: "GitLab 模式填写精确项目 URL 或 group/project；local 模式留空"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "任务管理后端={{ inputs.task_backend }}；local 模式强制 vcs=none；GitLab 项目={{ inputs.gitlab_project }}；{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "请在进入技术规划前审阅生成的功能规格。"
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "请在生成任务前审阅技术实施计划。"
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "任务管理后端={{ inputs.task_backend }}；GitLab 项目={{ inputs.gitlab_project }}；{{ inputs.spec }}"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "强制检查既有符号复用、NM-### 新建例外、PB-### 受保护行为、Bug 复现与变更前后回归矩阵"

  - id: review-tasks
    type: gate
    message: "请同时审阅 tasks.md 与一致性分析。存在 CRITICAL、缺失复用证据或回归关卡时必须拒绝；只有批准当前版本后，才会同步 GitLab Issues（如已选择）并开始实现。"
    options: [approve, reject]
    on_reject: abort

  - id: sync-gitlab-issues
    type: if
    condition: "{{ inputs.task_backend == 'gitlab' }}"
    then:
      - id: publish-gitlab-issues
        command: speckit.taskstoissues
        integration: "{{ inputs.integration }}"
        input:
          args: "provider=gitlab；project={{ inputs.gitlab_project }}；tasks 已由 review-tasks 批准"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "任务管理后端={{ inputs.task_backend }}；local 模式强制 vcs=none；{{ inputs.spec }}"
